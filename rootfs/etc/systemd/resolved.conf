[Resolve]
# Глобальные DNS ПередОС. Серверы, выданные по DHCP, остаются для своих доменов.
DNS=1.1.1.1#cloudflare-dns.com 8.8.8.8#dns.google 9.9.9.9#dns.quad9.net
FallbackDNS=1.0.0.1#cloudflare-dns.com 8.8.4.4#dns.google
# opportunistic/allow-downgrade: не ломают сети, где DoT или DNSSEC недоступны
# (корпоративные сети, captive-порталы)
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
MulticastDNS=no
LLMNR=no
Cache=yes
DNSStubListener=yes
ReadEtcHosts=yes
